<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A1 Math</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        background-color: #ffffff;
        background-image: 
            linear-gradient(45deg, #eee 25%, transparent 25%), 
            linear-gradient(-45deg, #eee 25%, transparent 25%), 
            linear-gradient(45deg, transparent 75%, #eee 75%), 
            linear-gradient(-45deg, transparent 75%, #eee 75%);
        background-size: 40px 40px;
        background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
        transition: 0.3s;
        color: #333;
    }

    .logo { font-size: 55px; font-weight: bold; padding-top: 20px; color: #333; text-shadow: 2px 2px 3px #aaa; }
    .gen { font-size: 22px; margin-top: -10px; color: #555; font-weight: bold; letter-spacing: 2px; text-shadow: 1px 1px 2px #aaa; }
    h1 { font-size: 45px; margin: 20px 0; text-shadow: 1px 1px 3px #aaa; }

    #question {
        font-size: 60px; /* أكبر حجم */
        margin: 50px auto 30px auto;
        padding: 40px 60px;
        background: rgba(255, 255, 255, 0.9); 
        color: #333;
        display: block;
        border-radius: 25px;
        box-shadow: 0px 0px 20px #ccc;
        min-width: 600px; /* أعرض */
        max-width: 90%;
        transition: 0.3s;
    }

    #answer {
        padding: 20px;
        font-size: 32px;
        width: 400px;
        max-width: 90%;
        border-radius: 15px;
        border: 2px solid #ccc;
        margin-bottom: 25px;
        text-align: center;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }

    input, select {
        font-size: 22px;
        border-radius: 12px;
    }

    button {
        padding: 14px 30px; font-size: 22px; border: none; border-radius: 12px; cursor: pointer;
        background: #4CAF50; color: white; margin: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); transition: 0.3s;
    }
    button:hover { transform: scale(1.1); background: #45a049; }

    #score, #timer, #stage { font-size: 28px; margin-top: 15px; font-weight: bold; text-shadow: 1px 1px 2px #aaa; }
    #winScreen { display: none; font-size: 45px; margin-top: 50px; color: #00b300; text-shadow: 2px 2px 6px #aaa; }
    .dark { background-color: #222; color: #fff; background-image: none; }
    .dark #question { background: #333; color: white; box-shadow: 0 0 20px #555; }
</style>
</head>
<body>

<div class="logo">A1</div>
<div class="gen">Generated by A1</div>
<h1>🎮 A1 Math</h1>

<select id="difficulty">
    <option value="easy">Easy ( + )</option>
    <option value="medium">Medium ( + , - )</option>
    <option value="hard">Hard ( + , - , × , ÷ )</option>
</select>

<br><br>
<label for="timeSelect" style="font-size:20px;">Time per question (seconds):</label>
<select id="timeSelect">
    <option value="10">10</option>
    <option value="20">20</option>
    <option value="30">30</option>
    <option value="45">45</option>
    <option value="60">60</option>
</select>

<br><br>
<button onclick="toggleDarkMode()">Dark / Light Mode</button>
<button id="pauseBtn" onclick="togglePause()">Pause</button>

<p id="stage">Stage: 1 / 4</p>
<p id="question">Click Start!</p>

<input type="number" id="answer" placeholder="Your answer">

<div>
<button onclick="checkAnswer()">Submit</button>
<button onclick="newQuestion()">Start</button>
</div>

<p id="timer">Time: 10</p>
<p id="score">Score: 0</p>
<div id="winScreen">🎉 YOU WON ALL STAGES! 🔥<br><button onclick="resetGame()">Play Again</button></div>

<audio id="correctSound" src="https://cdn.pixabay.com/audio/2021/09/07/audio_1d0b9efc41.mp3"></audio>
<audio id="wrongSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_52dbf50a42.mp3"></audio>

<script>
let num1, num2, correct, timer;
let score = 0, questionCount = 0, stage = 1;
let timeLeft = 10, isPaused = false;

function toggleDarkMode() { document.body.classList.toggle("dark"); }
function randomOperation(difficulty) {
    if (difficulty === "easy") return "+";
    if (difficulty === "medium") return ["+", "-"][Math.floor(Math.random()*2)];
    if (difficulty === "hard") return ["+", "-", "×", "÷"][Math.floor(Math.random()*4)];
}

function newQuestion() {
    if(isPaused) return;
    clearInterval(timer);
    startTimer();

    let difficulty = document.getElementById("difficulty").value;
    let op = randomOperation(difficulty);

    num1 = Math.floor(Math.random()*20)+1;
    num2 = Math.floor(Math.random()*20)+1;

    if(op==="+") correct = num1 + num2;
    if(op==="-") correct = num1 - num2;
    if(op==="×") correct = num1 * num2;
    if(op==="÷") { num1 = num2 * (Math.floor(Math.random()*10)+1); correct = num1 / num2; }

    document.getElementById("question").innerHTML = `What is ${num1} ${op} ${num2}?`;
    document.getElementById("answer").value = "";
    document.getElementById("question").style.background = "rgba(255,255,255,0.9)";
}

function startTimer() {
    timeLeft = Number(document.getElementById("timeSelect").value);
    document.getElementById("timer").innerHTML = "Time: " + timeLeft;

    timer = setInterval(() => {
        if(isPaused) return;
        timeLeft--;
        document.getElementById("timer").innerHTML = "Time: " + timeLeft;
        if(timeLeft<=0){
            clearInterval(timer);
            score--;
            flashWrong();
            document.getElementById("score").innerHTML = "Score: " + score;
            questionCount++;
            nextStageCheck();
        }
    },1000);
}

function checkAnswer(){
    if(isPaused) return;
    let userAns = Number(document.getElementById("answer").value);
    questionCount++;
    if(userAns===correct){
        score++;
        document.getElementById("correctSound").play();
        flashCorrect();
    } else{
        score--;
        document.getElementById("wrongSound").play();
        flashWrong();
    }
    document.getElementById("score").innerHTML = "Score: "+score;
    nextStageCheck();
}

function nextStageCheck(){
    if(questionCount >= 10){
        if(stage<4){
            stage++;
            questionCount=0;
            document.getElementById("stage").innerHTML = "Stage: "+stage+" / 4";
            alert(`🎉 Stage ${stage} unlocked!`);
        } else{
            document.getElementById("winScreen").style.display="block";
            return;
        }
    }
    newQuestion();
}

function flashWrong(){
    let q=document.getElementById("question");
    q.style.background="rgba(255,0,0,0.7)";
    setTimeout(()=>{q.style.background="rgba(255,255,255,0.9)";},300);
}

function flashCorrect(){
    let q=document.getElementById("question");
    q.style.background="rgba(0,255,0,0.7)";
    setTimeout(()=>{q.style.background="rgba(255,255,255,0.9)";},200);
}

function resetGame(){
    score=0; questionCount=0; stage=1; isPaused=false;
    document.getElementById("winScreen").style.display="none";
    document.getElementById("score").innerHTML="Score: 0";
    document.getElementById("stage").innerHTML="Stage: 1 / 4";
    document.getElementById("pauseBtn").innerText="Pause";
    newQuestion();
}

function togglePause(){
    if(!isPaused){
        clearInterval(timer);
        isPaused=true;
        document.getElementById("pauseBtn").innerText="Resume";
        document.getElementById("question").innerHTML="⏸ Game Paused";
    } else{
        isPaused=false;
        document.getElementById("pauseBtn").innerText="Pause";
        newQuestion();
    }
}
</script>

</body>
</html>
